# 用于不接真实模型、只验证调度/协议/UI 的 mock 配置。
# mock worker 用确定性概率模拟模型输出，不消耗 API 额度。

server: "http://127.0.0.1:8000"

runtime:
  interval: 1
  max_workers: 4
  max_running_projects: 2
  max_project_workers: 4
  healthcheck_timeout: 2
  worker_healthcheck: "startup_only"
  prompt_group: "mock"
  workspace_root: "./workspaces-mock"
  completed_action: "keep"

tasks:
  bootstrap:
    timeout: 10
    conclude_timeout: 5
  reason:
    timeout: 5
    max_intents: 2
  explore:
    timeout: 10
    conclude_timeout: 5

workers:
  - name: "mock-a"
    type: "mock"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,0],"outcomes":{"ok":1.0,"fail":0.0}}'
      MOCK_BOOTSTRAP: '{"delay":[0,0],"outcomes":{"complete":0.0,"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_REASON: '{"delay":[0,0],"outcomes":{"complete":0.0,"intent":1.0,"noop":0.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'

  - name: "mock-b"
    type: "mock"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 1
    env:
      MOCK_HEALTHCHECK: '{"delay":[0,0],"outcomes":{"ok":1.0,"fail":0.0}}'
      MOCK_BOOTSTRAP: '{"delay":[0,0],"outcomes":{"complete":1.0,"fact":0.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_BOOTSTRAP_CONCLUDE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_REASON: '{"delay":[0,0],"outcomes":{"complete":1.0,"intent":0.0,"noop":0.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_EXPLORE_EXECUTE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
      MOCK_EXPLORE_CONCLUDE: '{"delay":[0,0],"outcomes":{"fact":1.0,"rejected":0.0,"invalid_json":0.0,"invalid_payload":0.0,"command_fail":0.0}}'
