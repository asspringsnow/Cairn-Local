# Cairn 单机部署配置示例。
#
# 模型 / Base URL / API Key 不写在这里：启动后在 Web UI 的
# 「服务器设置 -> Agent 模型」里配置，保存后 dispatcher 下一轮任务自动生效。
#
# 复制为 dispatch.yaml 后按需修改：
#   cp dispatch.example.yaml dispatch.yaml

server: "http://127.0.0.1:8000"

runtime:
  # 调度轮询与心跳周期（秒）。
  interval: 3
  # 全局并发任务上限。
  max_workers: 8
  # 同时调度的项目数上限。
  max_running_projects: 5
  # 单项目并发任务上限。
  max_project_workers: 4
  # 启动时模型连通性检查的超时（秒）。
  healthcheck_timeout: 15
  # startup_only：启动时检查一次；startup_and_task：每个任务前也检查；
  # disabled：不自动检查。
  worker_healthcheck: "startup_only"
  # prompt 组，随包分发在 cairn/src/cairn/dispatcher/prompts/ 下。
  prompt_group: "default"
  # 每个项目的工作目录根。相对路径相对于 dispatcher 启动目录。
  workspace_root: "./workspaces"
  # 项目完成后保留工作目录（keep）或删除（remove）。
  completed_action: "keep"

tasks:
  bootstrap:
    # 初始阶段直接尝试解决问题的超时（秒）。
    timeout: 120
    # 主阶段超时/解析失败后，同一 session 收尾写 Fact 的超时。
    conclude_timeout: 30
  reason:
    timeout: 300
    # 一次 reason 最多声明多少个新 Intent。
    max_intents: 3
  explore:
    timeout: 600
    conclude_timeout: 120

# 可选。省略时自动创建一个 native worker：
#   name=cairn, task_types=[bootstrap, reason, explore], max_running=max_workers
# 只有一个 native worker，因为模型配置是全局一份。
workers:
  - name: "cairn"
    type: "native"
    task_types: [bootstrap, reason, explore]
    max_running: 8
    priority: 0
